<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giovana Maquiadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Giovana Maquiadora 💄</h1>
    <p>Realcando sua beleza com atendimento personalizado</p>
  </header>

  <main>
    <section class="card" id="login-card">
      <h2>Login</h2>
      <p class="subtitle">Entre como admin ou usuario para acessar os agendamentos.</p>

      <div class="auth-tabs" role="tablist" aria-label="Acesso">
        <button type="button" class="auth-tab is-active" id="tab-login" data-tab="login" role="tab" aria-selected="true">Login</button>
        <button type="button" class="auth-tab" id="tab-cadastro" data-tab="cadastro" role="tab" aria-selected="false">Criar conta</button>
      </div>

      <section id="painel-login" class="auth-panel">
        <form id="login-form">
          <label for="login-perfil">Entrar como</label>
          <select id="login-perfil" required>
            <option value="usuario">Usuario</option>
            <option value="admin">Admin</option>
          </select>

          <label for="login-usuario">Usuario</label>
          <input type="text" id="login-usuario" placeholder="admin ou usuario" required>

          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" placeholder="Sua senha" required>

          <button type="submit">Entrar</button>
        </form>

        <p class="credenciais">
          Admin: <strong>admin / admin123</strong><br>
          Usuario: <strong>usuario / usuario123</strong>
        </p>

        <p id="mensagem-login" role="status" aria-live="polite"></p>
      </section>

      <section id="painel-cadastro" class="auth-panel hidden">
        <h3>Criar conta de usuario</h3>
        <form id="cadastro-form">
          <label for="cadastro-nome">Nome</label>
          <input type="text" id="cadastro-nome" placeholder="Seu nome" required>

          <label for="cadastro-usuario">Usuario</label>
          <input type="text" id="cadastro-usuario" placeholder="Ex: maria123" required>

          <label for="cadastro-senha">Senha</label>
          <input type="password" id="cadastro-senha" placeholder="Minimo 4 caracteres" required>

          <button type="submit">Criar conta</button>
        </form>
        <p id="mensagem-cadastro" role="status" aria-live="polite"></p>
      </section>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
