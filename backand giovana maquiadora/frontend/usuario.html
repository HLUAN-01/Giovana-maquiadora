<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Usuario - Giovana Maquiadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Painel Usuario</h1>
    <p>Acompanhe seus agendamentos</p>
  </header>

  <main>
    <section class="card">
      <div class="painel-topo">
        <div>
          <h2>Agendar horario</h2>
          <p class="subtitle" id="usuario-logado"></p>
        </div>
        <button type="button" id="btn-logout">Sair</button>
      </div>

      <p class="subtitle">Voce visualiza apenas seus proprios agendamentos.</p>

      <form id="agendamento-form">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>

        <label for="data">Data</label>
        <input type="date" id="data" required>

        <label for="hora">Horario</label>
        <input type="time" id="hora" required>

        <label for="servico">Servico</label>
        <select id="servico" required>
          <option value="Maquiagem festa">Maquiagem festa</option>
          <option value="Maquiagem noiva">Maquiagem noiva</option>
          <option value="Maquiagem social">Maquiagem social</option>
        </select>

        <button type="submit">Agendar</button>
      </form>

      <p id="mensagem" role="status" aria-live="polite"></p>

      <section class="lista-agendamentos">
        <h3>Meus agendamentos</h3>
        <ul id="lista-agendamentos"></ul>
      </section>
    </section>
  </main>

  <script src="usuario.js"></script>
</body>
</html>
